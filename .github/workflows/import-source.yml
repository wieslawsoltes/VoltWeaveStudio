name: Import verified source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initial-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify and unpack original source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync, rmSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          const manifest = JSON.parse(readFileSync('.bootstrap/manifest.json', 'utf8'));
          const encoded = manifest.parts.map(path => {
            if (!/^\.bootstrap\/source-\d+\.b64$/.test(path)) throw Error('Invalid part path');
            return readFileSync(path, 'utf8').trim();
          }).join('');
          const compressed = Buffer.from(encoded, 'base64');
          if (createHash('sha256').update(compressed).digest('hex') !== manifest.sha256)
            throw Error('Source package checksum mismatch');
          const files = JSON.parse(brotliDecompressSync(compressed, { maxOutputLength: 5_000_000 }));
          if (Object.keys(files).length !== manifest.fileCount) throw Error('File count mismatch');
          for (const [path, content] of Object.entries(files)) {
            if (path.startsWith('/') || path.includes('\\') || path.split('/').some(p => p === '..' || p === '.git' || p === '.github' || p === '.bootstrap'))
              throw Error('Unsafe source path: ' + path);
            if (typeof content !== 'string') throw Error('Source must be UTF-8 text');
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, content);
          }
          rmSync('.bootstrap', { recursive: true });
          console.log('Verified and unpacked ' + manifest.fileCount + ' original source files.');
          NODE
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run core and Worker tests
        run: npm test
      - name: Generate standalone distribution
        run: python3 tools/standalone.py
      - name: Commit readable source and standalone distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import complete VoltWeave Studio source, examples, tests and standalone build'
          git push origin HEAD:main
